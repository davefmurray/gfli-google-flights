name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check fli/ scripts/ tests/
      - run: uv run --frozen ruff format --check fli/ scripts/ tests/
      - run: make test-offline
      - run: uv build
      - run: uv run --frozen twine check dist/*

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fli-js
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - run: bun run build
