name: Publish GLFI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after verification (requires configured trusted publisher)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Require matching GLFI release tag for publishing
        if: inputs.publish
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected = f'refs/tags/glfi-v{version}'
          if os.environ['GITHUB_REF'] != expected:
              raise SystemExit(f'Publish must run on {expected}')
          PY
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glfi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
