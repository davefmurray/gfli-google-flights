name: Publish GFLI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after verification (requires configured trusted publisher)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gfli-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - name: Require matching GFLI release tag for publishing
        if: inputs.publish
        run: uv run --no-project python scripts/check_release.py --ref "$GITHUB_REF"
      - run: uv build
      - run: uv run --frozen --extra dev twine check dist/*
      - run: uv run --frozen python scripts/verify_install.py dist/gfli-*.whl --mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.repository == 'davefmurray/gfli-google-flights'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gfli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
